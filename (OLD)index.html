<html lang="fr">
<head>
  <script id="Cookiebot" src="https://consent.cookiebot.com/uc.js" data-cbid="cced738a-fa5f-4aff-8391-a37454d4b7ab" data-blockingmode="auto" type="text/javascript"></script>

  <title>Vérification IA des appels — assurance, banque : ne doutez plus</title>
  <meta name="description" content="L'IA répond à votre place aux appels d'assurance, de carte bancaire ou d'opérateur, et vérifie les montants et conditions annoncés." />

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />

  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root{
      --bg:#F5F5F7; --surface:#FFFFFF; --surface-soft:#EFEFF1; --surface-soft-2:#F2F2F4;
      --surface-blue:#EEF2FF; --surface-green:#F3F6E9;
      --ink:#111113; --text:#1D1D1F; --muted:#6E6E73; --subtle:#8E8E93;
      --line:#D9D9DE; --line-strong:#C7C7CC;
      --cobalt:#3F7FE0; --cobalt-hover:#3269C4;
      --signal:#C9FF57; --danger:#E95360; --warning:#E7A62E; --success:#229B6D;
      --radius-control:10px; --radius-button:12px; --radius-card:18px; --radius-media:22px;
      --page-pad:clamp(16px,4vw,56px); --max:1320px; --ease:cubic-bezier(.16,1,.3,1); --header-h:64px;
      --font-ko:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      --font-en:"Manrope","Pretendard Variable",Pretendard,sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    .ic{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
    .ic svg{width:1em;height:1em;display:block}
    html{scroll-behavior:smooth;background:var(--bg);-webkit-text-size-adjust:100%}
    body{min-width:0;overflow-x:hidden;background:var(--bg);color:var(--text);font-family:var(--font-ko);font-size:16px;line-height:1.6;letter-spacing:-.018em;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
    html[lang="fr"] body{letter-spacing:-.01em}
    html[lang="ko"] h1,html[lang="ko"] h2,html[lang="ko"] h3,html[lang="ko"] p,html[lang="ko"] button,html[lang="ko"] a{word-break:keep-all}
    html[lang="fr"] h1,html[lang="fr"] h2,html[lang="fr"] h3,html[lang="fr"] p,html[lang="fr"] button,html[lang="fr"] a{word-break:normal;overflow-wrap:anywhere;hyphens:auto}
    a{color:inherit;text-decoration:none}
    button,input{font:inherit}
    button{cursor:pointer}
    img,video{display:block;width:100%;max-width:100%}
    button,a{-webkit-tap-highlight-color:transparent}
    :focus-visible{outline:3px solid rgba(63,127,224,.26);outline-offset:3px}
    .container{width:min(100%,var(--max));margin-inline:auto;padding-inline:var(--page-pad)}
    .section{padding:clamp(76px,9vw,136px) 0}
    .section-soft{background:#EFEFF1}
    .eyebrow{display:inline-flex;align-items:center;gap:9px;color:var(--muted);font:700 12px/1 var(--font-en);letter-spacing:.08em;text-transform:uppercase}
    .eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--signal);box-shadow:0 0 0 5px rgba(201,255,87,.13)}
    .section-head{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(260px,.8fr);gap:30px;align-items:end;margin-bottom:30px}
    .section-head h2,.survey-intro h2,.trust-copy h2,.faq-head h2{margin-top:14px;color:var(--ink);font-size:clamp(38px,5.3vw,72px);line-height:1.02;letter-spacing:-.05em;font-weight:620;text-wrap:balance}
    html[lang="fr"] .section-head h2,html[lang="fr"] .survey-intro h2,html[lang="fr"] .trust-copy h2,html[lang="fr"] .faq-head h2{letter-spacing:-.035em}
    .section-head>p{justify-self:end;max-width:430px;color:var(--muted);font-size:15px;line-height:1.65}
    .btn{min-height:48px;border:1px solid transparent;border-radius:var(--radius-button);padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:650;transition:background .2s var(--ease),border-color .2s var(--ease),transform .2s var(--ease),color .2s var(--ease)}
    .btn:active{transform:translateY(1px)}
    .btn-primary{background:var(--cobalt);color:#fff}
    .btn-primary:hover{background:var(--cobalt-hover)}
    .btn-secondary{background:#fff;color:var(--text);border-color:var(--line-strong)}
    .btn-secondary:hover{background:#F8F8FA}
    .btn-dark{background:var(--ink);color:#fff}
    .btn[disabled]{cursor:not-allowed;opacity:.45}
    .header{position:sticky;top:0;z-index:50;background:rgba(245,245,247,.88);border-bottom:1px solid rgba(17,17,19,.08);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
    .nav{min-height:var(--header-h);display:flex;align-items:center;gap:18px}
    .brand{color:var(--ink);font:700 20px/1 var(--font-en);letter-spacing:-.045em;white-space:nowrap}
    .brand .accent{color:var(--cobalt)}
    .nav-links{display:flex;align-items:center;gap:22px;margin-left:28px;color:var(--muted);font-size:13px;font-weight:650}
    .nav-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
    .lang-toggle{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:999px;padding:3px;background:#fff}
    .lang-toggle button{min-width:38px;height:32px;border:0;border-radius:999px;background:transparent;color:var(--subtle);font:700 11px/1 var(--font-en)}
    .lang-toggle button[aria-pressed="true"]{background:var(--ink);color:#fff}
    .nav .btn{min-height:40px;padding-inline:14px;font-size:13px}
    .hero{position:relative;padding:clamp(54px,6.5vw,92px) 0 clamp(48px,6vw,78px);overflow:hidden;background:radial-gradient(circle at 80% 8%,rgba(63,127,224,.08),transparent 26%),radial-gradient(circle at 16% 78%,rgba(201,255,87,.07),transparent 20%),linear-gradient(180deg,#FBFBFD,#F5F5F7)}
    .hero-grid{display:grid;grid-template-columns:minmax(0,1.16fr) minmax(340px,.84fr);gap:clamp(34px,6vw,86px);align-items:center}
    .hero-copy{max-width:820px;min-width:0}
    .hero .eyebrow{margin-bottom:20px}
    .hero h1{max-width:940px;color:var(--ink);font-size:clamp(50px,6.8vw,96px);line-height:1.0;letter-spacing:-.055em;font-weight:650;text-wrap:balance}
    html[lang="fr"] .hero h1{font-size:clamp(46px,5.9vw,84px);line-height:1.02;letter-spacing:-.04em}
    .hero h1 .soft{display:block;color:#75757A;font-weight:520}
    .hero-sub{max-width:700px;margin-top:24px;color:var(--muted);font-size:clamp(17px,1.55vw,21px);line-height:1.6}
    .hero-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:28px}
    .hero-note{width:100%;color:var(--subtle);font-size:13px;font-weight:600}
    .hero-side{width:100%;min-width:0}
    .video-shell{position:relative;width:100%;min-height:520px;overflow:hidden;border:1px solid #D8D8DC;border-radius:var(--radius-media);background:radial-gradient(circle at 50% 14%,rgba(63,127,224,.11),transparent 28%),linear-gradient(145deg,#ECECF0,#E2E2E7),url('assets/hero-poster.webp');background-size:cover;background-position:center;box-shadow:0 18px 45px rgba(0,0,0,.055)}
    .video-shell video,.video-shell .video-fallback{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .video-poster-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
    .video-fallback{display:grid;place-items:center;background:radial-gradient(circle at 50% 22%,rgba(63,127,224,.10),transparent 26%),linear-gradient(145deg,#F0F0F3,#E6E6EA);color:var(--subtle);font-size:13px;font-weight:650}
    .video-veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.02) 40%,rgba(16,20,30,.48) 100%);pointer-events:none}
    .risk-toast{position:absolute;left:16px;right:16px;bottom:16px;z-index:2;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:15px;border-radius:14px;background:rgba(255,255,255,.92);border:1px solid rgba(17,17,19,.09);backdrop-filter:blur(16px);box-shadow:0 14px 36px rgba(0,0,0,.08)}
    .risk-icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#EEF6F0;color:var(--success);font-weight:800}
    .risk-toast strong{display:block;font-size:14px;line-height:1.35}
    .risk-toast p{margin-top:3px;color:var(--muted);font-size:12px;line-height:1.4}
    .risk-state{display:inline-flex;align-items:center;gap:7px;color:#424248;font-size:11px;font-weight:700;white-space:nowrap}
    .risk-state i{width:8px;height:8px;border-radius:50%;background:var(--signal);box-shadow:0 0 0 4px rgba(201,255,87,.18)}
    .hero-zeros{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
    .hero-zeros>div{padding:0}
    .hero-zeros span{display:inline-flex;align-items:center;padding:9px 14px;border:1px solid var(--line-strong);border-radius:999px;background:#fff;color:var(--text);font-size:13px;font-weight:650}
    .problem-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .problem-card{min-height:430px;display:flex;flex-direction:column;justify-content:space-between;padding:24px;border:1px solid var(--line);border-radius:var(--radius-card);background:#fff;overflow:hidden;position:relative;box-shadow:0 12px 28px rgba(0,0,0,.035)}
    .problem-card:nth-child(1){background:linear-gradient(160deg,#FFFFFF,#F3F4F8)}
    .problem-card:nth-child(2){background:linear-gradient(160deg,#FFFFFF,#F4F5EF)}
    .problem-kicker{display:flex;justify-content:space-between;gap:16px;color:#74747A;font-size:12px;font-weight:700}
    .problem-visual{margin:26px 0 24px;min-height:270px;border-radius:14px;border:1px solid rgba(17,17,19,.07);background:#fff;display:grid;place-items:center;position:relative;overflow:hidden}
    .problem-photo{width:100%;height:100%;object-fit:cover;display:block}
    .problem-card h3{font-size:clamp(26px,2.8vw,36px);line-height:1.12;letter-spacing:-.035em;font-weight:600;max-width:620px}
    .problem-card p{margin-top:12px;color:var(--muted);max-width:560px}
    .how-panel{padding:clamp(20px,3vw,34px);border:1px solid var(--line);border-radius:var(--radius-card);background:linear-gradient(135deg,#EAF1FB,#F7F7F9 54%,#F0F2EA);box-shadow:0 12px 28px rgba(0,0,0,.035)}
    .how-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
    .how-step{min-height:230px;padding:20px;border:1px solid rgba(17,17,19,.07);border-radius:14px;background:rgba(255,255,255,.94);display:flex;flex-direction:column}
    .how-num{color:var(--subtle);font:700 11px/1 var(--font-en);letter-spacing:.06em}
    .how-icon{width:44px;height:44px;margin-top:34px;border-radius:12px;display:grid;place-items:center;background:var(--surface-blue);color:var(--cobalt);font-weight:800}
    .how-step:nth-child(3) .how-icon{background:#EEF6F0;color:var(--success)}
    .how-step:nth-child(4) .how-icon{background:var(--surface-green);color:#677B2C}
    .how-step h3{margin-top:auto;font-size:20px;line-height:1.25;letter-spacing:-.03em}
    .how-step p{margin-top:7px;color:var(--muted);font-size:13px;line-height:1.5}
    .survey{background:#F2F2F4;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
    .survey-shell{display:grid;grid-template-columns:minmax(260px,.64fr) minmax(0,1.36fr);gap:clamp(34px,6vw,78px);align-items:start}
    .survey-intro{position:sticky;top:calc(var(--header-h) + 28px)}
    .survey-intro h2{font-size:clamp(40px,4.8vw,64px)}
    .survey-intro p{margin-top:18px;color:var(--muted);max-width:430px}
    .survey-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
    .meta-chip{padding:8px 10px;border:1px solid var(--line-strong);border-radius:999px;background:rgba(255,255,255,.68);color:var(--muted);font-size:11px;font-weight:700}
    .survey-card{min-width:0;padding:clamp(20px,3vw,34px);border:1px solid var(--line-strong);border-radius:var(--radius-card);background:#fff;box-shadow:0 16px 36px rgba(0,0,0,.045);overflow:hidden}
    .survey-progress{display:flex;align-items:center;gap:16px;margin-bottom:28px;color:var(--subtle);font:700 12px/1 var(--font-en)}
    .progress-track{flex:1;height:5px;border-radius:999px;background:#EBEBEF;overflow:hidden}
    .progress-bar{height:100%;width:25%;background:var(--cobalt);border-radius:inherit;transition:width .3s var(--ease)}
    #questionViewport{position:relative;overflow:hidden;transition:height .34s var(--ease)}
    .survey-question{display:none}
    .survey-question.active{display:block}
    .survey-question h3{font-size:clamp(27px,3.4vw,42px);line-height:1.14;letter-spacing:-.04em;font-weight:600}
    .survey-help{margin-top:10px;color:var(--muted);font-size:14px}
    .option-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:24px}
    .option{min-height:62px;border:1px solid var(--line-strong);border-radius:var(--radius-control);background:#FCFCFD;color:var(--text);padding:14px 15px;text-align:left;font-weight:620;transition:background .2s var(--ease),border-color .2s var(--ease),box-shadow .2s var(--ease),transform .18s var(--ease)}
    .option:hover{border-color:rgba(63,127,224,.40);background:#F5F8FE}
    .option:active{transform:scale(.99)}
    .option.selected{border-color:var(--cobalt);background:var(--surface-blue);box-shadow:inset 0 0 0 1px var(--cobalt)}
    .option-check{display:inline-flex;align-items:center;gap:8px}
    .option-check i{font-size:16px;color:var(--line-strong);flex-shrink:0}
    .option.selected .option-check i{color:var(--cobalt)}
    .survey-actions{display:flex;justify-content:space-between;gap:10px;margin-top:28px}
    .survey-msg{min-height:22px;margin-top:12px;color:var(--danger);font-size:13px}
    .survey-success{display:none}
    .survey-success.show{display:block}
    .survey-success h3{font-size:clamp(30px,4vw,44px);line-height:1.1;letter-spacing:-.04em}
    .survey-success p{margin-top:14px;color:var(--muted)}
    .survey-summary{margin-top:22px;padding:16px;border:1px solid var(--line);border-radius:12px;background:#F7F7F9;display:grid;gap:9px}
    .summary-row{display:grid;grid-template-columns:110px 1fr;gap:12px;font-size:13px}
    .summary-row span:first-child{color:var(--subtle)}
    .hp{position:absolute!important;left:-9999px!important;width:1px!important;height:1px!important;overflow:hidden!important}
    .usecase-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .usecase-card{min-height:440px;border:1px solid var(--line);border-radius:var(--radius-card);background:#fff;padding:22px;display:flex;flex-direction:column;box-shadow:0 12px 28px rgba(0,0,0,.03)}
    .usecase-card:nth-child(2){background:#F7F7F9}
    .usecase-card:nth-child(3){background:#F4F5EE}
    .usecase-top{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--subtle);font:700 11px/1 var(--font-en)}
    .status-pill{display:inline-flex;align-items:center;gap:7px;padding:8px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);font-size:11px;font-weight:700}
    .status-pill i{width:7px;height:7px;border-radius:50%;background:var(--signal)}
    .usecase-visual{min-height:300px;height:300px;align-items:stretch;overflow:hidden;border-radius:14px}
    .usecase-photo{width:100%;height:100%;object-fit:cover;display:block}
    .scene{width:100%;border-radius:16px;border:.5px solid #E4E4EA;padding:16px 15px;display:flex;flex-direction:column;justify-content:center;gap:9px;font-family:var(--font-en)}
    .scene-kids{background:linear-gradient(160deg,#EAF1FB,#F3F6E9)}
    .scene-senior{background:linear-gradient(160deg,#EEF6F0,#F7F7F9)}
    .scene-incall{background:linear-gradient(160deg,#EAF1FB,#F4F5EE)}
    .scene i{line-height:1}
    .scene-actor{display:flex;flex-direction:column;align-items:center;gap:7px}
    .scene-label{font-size:11px;font-weight:700;color:var(--muted)}
    .scene-avatar{width:56px;height:56px;border-radius:50%;background:#fff;border:.5px solid #E4E4EA;display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--cobalt);box-shadow:0 4px 10px rgba(0,0,0,.05);position:relative}
    .scene-avatar-guard{color:#639922}
    .scene-avatar-danger{color:var(--success);box-shadow:0 4px 12px rgba(34,155,109,.12)}
    .scene-dot{position:absolute;top:-4px;right:-4px;width:20px;height:20px;border-radius:50%;background:var(--signal);border:2px solid #fff;display:flex;align-items:center;justify-content:center}
    .scene-dot i{font-size:11px;color:#3B4D0E}
    .scene-relation{display:flex;align-items:center;justify-content:space-between;gap:4px}
    .scene-link{flex:1.1;display:flex;flex-direction:column;align-items:center}
    .scene-dash{width:100%;height:1.5px;background:repeating-linear-gradient(90deg,#C7C7CC 0 5px,transparent 5px 10px)}
    .scene-link-ico{font-size:18px;color:var(--subtle);margin-top:6px}
    .scene-caption{font-size:9.5px;color:var(--subtle);margin-top:3px}
    .scene-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:999px;font-size:9.5px;font-weight:700}
    .scene-badge i{font-size:11px}
    .scene-badge-danger{background:var(--cobalt);color:#fff}
    .scene-badge-lg{font-size:10.5px;padding:5px 11px;align-self:center}
    .scene-badge-lg i{font-size:12px}
    .scene-result{align-self:center;display:inline-flex;align-items:center;gap:6px;margin-top:4px;padding:7px 13px;background:#fff;border:.5px solid #E4E4EA;border-radius:999px;font-size:11px;font-weight:700;color:#3B4D0E}
    .scene-result i{font-size:14px;color:#639922}
    .scene-senior{align-items:center}
    .scene-chev{font-size:15px;color:#A8A8AE}
    .scene-actor-row{flex-direction:row;gap:9px}
    .scene-actor-row .scene-avatar{width:48px;height:48px;font-size:24px}
    .scene-vdash{width:1.5px;height:16px;background:repeating-linear-gradient(180deg,#C7C7CC 0 4px,transparent 4px 8px)}
    .scene-notify{display:flex;align-items:center;gap:9px;padding:9px 12px;background:#fff;border:.5px solid #E4E4EA;border-radius:12px;box-shadow:0 3px 9px rgba(0,0,0,.05)}
    .scene-notify-ico{width:30px;height:30px;border-radius:8px;background:#F3F6E9;display:flex;align-items:center;justify-content:center}
    .scene-notify-ico i{font-size:18px;color:#639922}
    .scene-notify-txt{display:flex;flex-direction:column;text-align:left}
    .scene-notify-txt b{font-size:11px;font-weight:700;color:var(--ink);line-height:1.2}
    .scene-notify-txt small{font-size:9.5px;color:var(--subtle)}
    .scene-notify-ok{font-size:17px;color:#639922}
    .scene-incall{gap:8px}
    .scene-eyebrow{font-size:9px;font-weight:700;color:var(--subtle);letter-spacing:.03em}
    .scene-alert{display:flex;align-items:center;gap:10px;padding:10px 11px;background:#fff;border:.5px solid #CFE0F5;border-radius:11px}
    .scene-alert-ico{width:30px;height:30px;border-radius:8px;background:#EAF1FB;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .scene-alert-ico i{font-size:17px;color:var(--cobalt)}
    .scene-alert-txt{display:flex;flex-direction:column}
    .scene-alert-txt b{font-size:11px;font-weight:700;color:#2E5A9A;line-height:1.25}
    .scene-alert-txt small{font-size:9.5px;color:var(--subtle);margin-top:1px}
    .scene-incall .scene-chev{align-self:center}

      #how .how-step h3{grid-area:title;margin:0;font-size:16px;line-height:1.28;letter-spacing:-.025em}

      #survey .survey-intro h2{margin-top:10px;font-size:clamp(32px,8.7vw,40px);line-height:1.05}
      #survey .survey-intro p{margin-top:10px;font-size:13px;line-height:1.48}
      #survey .survey-meta{gap:6px;margin-top:12px}

      #survey .option{min-height:44px;padding:9px 10px;border-radius:9px;font-size:13px;line-height:1.3}
      #survey .survey-actions{margin-top:14px}

      #survey .survey-msg{min-height:16px;margin-top:6px;font-size:11px;line-height:1.35}

      .mobile-sticky .btn{min-height:42px;padding-inline:14px;font-size:12px}

<body>
  <header class="header">
    <div class="container nav">

  <main id="top">

            <div><span data-i18n="zero3"></span></div>

            </div>
          </div>
        </div>
      </div>
    </section>

            <h2 data-i18n="problemTitle"></h2>
          </div>
          <p data-i18n="problemDesc"></p>
        </div>

            <div><h3 data-i18n="problem1Title"></h3><p data-i18n="problem1Desc"></p></div>

            <div class="problem-kicker"><span data-i18n="problem2Kicker"></span><span data-i18n="problem2State"></span></div>
            <div class="problem-visual"><img class="problem-photo" src="assets/problem-2.png" alt="" loading="lazy" decoding="async" /></div>
            <div><h3 data-i18n="problem2Title"></h3><p data-i18n="problem2Desc"></p></div>
          </article>
        </div>
      </div>
    </section>

          </div>
        </div>
      </div>

            <h3 data-i18n="case2Title"></h3>
            <p data-i18n="case2Desc"></p>

    /* ============================================================================
       [3] 엔진
       ⚠️ 원본 공용 엔진 대비 확장한 부분:
         (a) multi-select 지원 — q.multi=true 인 문항은 배열로 답을 저장하고
             옵션 클릭 시 토글, 최소 1개 이상 선택해야 다음으로 진행
         (b) 언어별 문항 필터링 — q.only=['fr'] 인 문항은 KR 토글에서 제외되고
             진행바(n/n)도 필터링된 문항 수 기준으로 재계산
       ============================================================================ */
    const state = { lang:'ko', current:0, answers:{}, submitted:false };
    const $  = (s,r=document)=>r.querySelector(s);
    const $$ = (s,r=document)=>[...r.querySelectorAll(s)];

    const getInitialLang = () => {
      // 📝 FR 전용 버전: 언어 자동 감지를 끄고 FR로 고정.
      //    (KR 버전과 동일한 패턴 — 도메인별로 언어를 고정하는 방식)
      return 'fr';
    };
    const t = key => (I18N[state.lang][key] || I18N.ko[key] || key);
    const tf = obj => (obj?.[state.lang] || obj?.ko || '');

    // (b) 언어에 맞는 문항만 필터링
    function getQuestions(){
      return SURVEY.filter(q => !q.only || q.only.includes(state.lang));
    }

    function applyLanguage(lang){
      const prevQuestions = getQuestions();
      const prevId = prevQuestions[state.current]?.id;

      state.lang = lang;
      document.documentElement.lang = lang;
      localStorage.setItem('landing_lang', lang);
      $$('[data-i18n]').forEach(el=>{
        const key = el.dataset.i18n;
        const val = I18N[lang][key];
        el.textContent = (val!==undefined && val!=='') ? val : (I18N.ko[key]||'');
      });
      $$('[data-lang]').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.lang===lang)));
      document.title = t('metaTitle') || document.title;
      const meta = $('meta[name="description"]');
      if(meta && t('metaDescription')) meta.setAttribute('content', t('metaDescription'));

      // 언어 전환 시 같은 문항 id를 유지하려고 시도, 없으면 범위 안으로 보정
      const newQuestions = getQuestions();
      const matched = newQuestions.findIndex(q=>q.id===prevId);
      state.current = matched>=0 ? matched : Math.min(state.current, newQuestions.length-1);

      if(state.submitted) renderSummary();
      else renderSurvey();
    }

    $$('[data-lang]').forEach(btn=>btn.addEventListener('click', ()=>{
      applyLanguage(btn.dataset.lang);
      const url = new URL(location.href);
      url.searchParams.set('lang', btn.dataset.lang);
      history.replaceState({}, '', url);
    }));

    const reveals = $$('.reveal');
    if('IntersectionObserver' in window){
      const ro = new IntersectionObserver((es,obs)=>es.forEach(e=>{
        if(e.isIntersecting){ e.target.classList.add('visible'); obs.unobserve(e.target); }
      }), {threshold:.12, rootMargin:'0px 0px -32px 0px'});
      reveals.forEach(el=>ro.observe(el));
    }else reveals.forEach(el=>el.classList.add('visible'));

    $$('.faq-question').forEach(btn=>btn.addEventListener('click', ()=>btn.closest('.faq-item')?.classList.toggle('open')));

    const questionWrap   = $('#questionWrap');
    const progressText   = $('#progressText');
    const progressBar    = $('#progressBar');
    const prevBtn        = $('#prevBtn');
    const nextBtn        = $('#nextBtn');
    const msg            = $('#surveyMsg');
    const form           = $('#surveyForm');
    const success        = $('#surveySuccess');

    function total(){ return getQuestions().length; }

    function renderSurvey(){
      const questions = getQuestions();
      const q = questions[state.current];
      if(!q){ questionWrap.innerHTML=''; return; }

      // multi 문항은 답이 배열, 아니면 단일 값
      if(q.multi && !Array.isArray(state.answers[q.id])) state.answers[q.id] = [];

      const opts = q.options.map(o=>{
        const isSelected = q.multi
          ? (state.answers[q.id]||[]).includes(o.value)
          : state.answers[q.id]===o.value;
        const sel = isSelected ? ' selected' : '';
        const checkIcon = q.multi
          ? `<i class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${isSelected?'<rect x="4" y="4" width="16" height="16" rx="5"/><path d="M8 12.5l2.5 2.5L16 9"/>':'<rect x="4" y="4" width="16" height="16" rx="5"/>'}</svg></i>`
          : '';
        return `<button type="button" class="option${sel}" data-value="${o.value}">${q.multi?`<span class="option-check">${checkIcon}<span>${tf(o.label)}</span></span>`:tf(o.label)}</button>`;
      }).join('');

      questionWrap.innerHTML = `
        <section class="survey-question active">
          <h3>${tf(q.title)}</h3>
          ${tf(q.help) ? `<p class="survey-help">${tf(q.help)}</p>` : ''}
          <div class="option-grid" data-group="${q.id}">${opts}</div>
        </section>`;

      $$('.option', questionWrap).forEach(btn=>{
        btn.addEventListener('click', ()=>{
          if(q.multi){
            const arr = state.answers[q.id]||[];
            const v = btn.dataset.value;
            const idx = arr.indexOf(v);
            if(idx>=0) arr.splice(idx,1); else arr.push(v);
            state.answers[q.id] = arr;
            renderSurvey(); // 체크 아이콘 갱신 위해 재렌더
          }else{
            state.answers[q.id] = btn.dataset.value;
            $$('.option', questionWrap).forEach(x=>x.classList.toggle('selected', x===btn));
          }
          msg.textContent='';
        });
      });

      progressText.textContent = `${state.current+1} / ${total()}`;
      progressBar.style.width = `${((state.current+1)/total())*100}%`;
      prevBtn.disabled = state.current===0;
      nextBtn.textContent = state.current===total()-1 ? t('submit') : t('next');
      msg.textContent='';
    }

    function validateCurrent(){
      const q = getQuestions()[state.current];
      const val = state.answers[q.id];
      const ok = q.multi ? Array.isArray(val) && val.length>0 : !!val;
      if(!ok){ msg.textContent = t('needAnswer'); return false; }
      return true;
    }

    prevBtn.addEventListener('click', ()=>{
      if(state.current<=0) return;
      state.current--; renderSurvey();
    });

    nextBtn.addEventListener('click', async ()=>{
      if(!validateCurrent()) return;
      if(state.current < total()-1){ state.current++; renderSurvey(); return; }
      await submitSurvey();
    });

    function collectTracking(){
      const params = new URLSearchParams(location.search);
      const keys = ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','fbclid'];
      const out = {};
      keys.forEach(k=>out[k]=(params.get(k)||'').slice(0,300)||null);
      out.referrer = (document.referrer||'').slice(0,500)||null;
      out.page_path = location.pathname.slice(0,300);
      out.variant = (params.get('v')||params.get('variant')||'').slice(0,80)||null;
      return out;
    }

    /* 📝 이 랜딩페이지만의 고유 ID — 페이지마다 반드시 다르게! (예: fr-factcheck, id-factcheck) */
    const SITE_ID = 'fr-factcheck';

    function payload(){
      // multi 응답은 콤마로 join해서 시트에 한 줄로 저장되도록 함
      const flatAnswers = {};
      Object.entries(state.answers).forEach(([k,v])=>{
        flatAnswers[k] = Array.isArray(v) ? v.join(',') : v;
      });
      return {
        site: SITE_ID,
        language: state.lang,
        answers: flatAnswers,
        website: $('#website')?.value || '',
        ...collectTracking()
      };
    }

    async function submitSurvey(){
      nextBtn.disabled = true; prevBtn.disabled = true;
      nextBtn.textContent = t('sending'); msg.textContent='';
      const data = payload();

      const SHEET_ENDPOINT = '/api/submit';

      console.log('[LANDING] survey submitted', data);

      try {
        const res = await fetch(SHEET_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        if (!res.ok) {
          console.warn('[LANDING] save failed, status:', res.status);
        }
      } catch (err) {
        console.warn('[LANDING] save threw (무시하고 진행)', err);
      }

      setTimeout(() => showSuccess(true), 250);
    }

    function renderSummary(){
      const summary = $('#surveySummary');
      if(!summary) return;
      const rows = getQuestions().map(q=>{
        const val = state.answers[q.id];
        let display = '—';
        if(q.multi && Array.isArray(val) && val.length){
          display = val.map(v=>tf(q.options.find(o=>o.value===v)?.label)).join(', ');
        }else if(val){
          const opt = q.options.find(o=>o.value===val);
          display = opt ? tf(opt.label) : '—';
        }
        return [tf(q.title), display];
      });
      summary.innerHTML = rows.map(([k,v])=>`<div class="summary-row"><span>${k}</span><strong>${v}</strong></div>`).join('');
    }

    function showSuccess(saved){
      state.submitted = true;
      form.style.display='none';
      success.classList.add('show');
      $('#successBody').textContent = saved ? t('successBody') : t('localSuccessBody');
      $('.survey-success h3').textContent = saved ? t('successTitle') : t('localSuccessTitle');
      renderSummary();
      success.scrollIntoView({behavior:'smooth', block:'center'});
    }

    $('#resetSurvey').addEventListener('click', ()=>{
      Object.assign(state, { current:0, answers:{}, submitted:false });
      $('#website').value='';
      success.classList.remove('show');
      form.style.display='';
      nextBtn.disabled=false;
      renderSurvey();
      form.scrollIntoView({behavior:'smooth', block:'center'});
    });

    const sticky = $('#mobileSticky');
    const surveySection = $('#survey');
    function updateSticky(){
      if(innerWidth>767){ sticky.classList.remove('show'); sticky.setAttribute('aria-hidden','true'); return; }
      const y = scrollY;
      const show = y > innerHeight*.65 && y < surveySection.offsetTop - 180;
      sticky.classList.toggle('show', show);
      sticky.setAttribute('aria-hidden', String(!show));
    }
    addEventListener('scroll', updateSticky, {passive:true});
    addEventListener('resize', updateSticky, {passive:true});

    applyLanguage(getInitialLang());
    renderSurvey();
    updateSticky();
  })();
  </script>
</body>
</html>
